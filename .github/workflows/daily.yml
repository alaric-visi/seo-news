name: Daily SEO news

on:
  schedule:
    # 05:15 UTC = 05:15 London in winter, 06:15 in summer.
    # Also outside DeepSeek's peak-price hours (01:00–04:00 and 06:00–10:00 UTC on weekdays).
    - cron: '15 5 * * *'
  workflow_dispatch:
    inputs:
      summarise_days:
        description: 'How many recent days to summarise (use more to backfill)'
        default: '3'
        required: false

concurrency:
  group: daily-seo-news
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEWS_STORE: supabase
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-flash' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Fetch feeds
        id: fetch
        run: npm run news:fetch

      - name: Write AI summaries
        # Optional: a DeepSeek outage must not stop the day's stories being published.
        continue-on-error: true
        run: npm run news:summarise -- --days=${{ inputs.summarise_days || '3' }}

      - name: Rebuild the site
        if: ${{ steps.fetch.outcome == 'success' }}
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$NETLIFY_BUILD_HOOK" ]; then
            echo "::notice::NETLIFY_BUILD_HOOK is not set; skipping the rebuild."
            exit 0
          fi
          curl -fsS -X POST -d '{}' "$NETLIFY_BUILD_HOOK"
